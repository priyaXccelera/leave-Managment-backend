server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: identity-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1500000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt-secret: ${JWT_SECRET}
  access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:3600}
  refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
  internal-api-key: ${INTERNAL_API_KEY}
  leave-service-url: ${LEAVE_SERVICE_URL}
  seed-password: ${SEED_PASSWORD:Password@123}
  login-rate-limit: ${LOGIN_RATE_LIMIT:10}
  login-rate-window-seconds: ${LOGIN_RATE_WINDOW_SECONDS:60}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.company.leave: INFO
